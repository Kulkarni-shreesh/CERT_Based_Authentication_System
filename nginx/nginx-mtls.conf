worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/nginx/mime.types";
    default_type  application/octet-stream;
    sendfile      on;

    log_format mtls '$remote_addr - $ssl_client_verify - $ssl_client_s_dn - [$time_local] "$request" $status';
    access_log "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/logs/mtls-access.log" mtls;
    error_log  "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/logs/mtls-error.log" info;

    server {
        listen 443 ssl;
        server_name localhost cert-auth.local;

        ssl_certificate      "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/pki/certs/server-fullchain.crt";
        ssl_certificate_key  "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/pki/private/server.key";

        ssl_client_certificate "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/pki/certs/ca-chain.crt";
        ssl_crl "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/pki/crl/ca-chain.crl";
        ssl_verify_client on;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header X-SSL-Client-Verify $ssl_client_verify always;
        add_header X-SSL-Client-DN $ssl_client_s_dn always;

        location / {
            root "C:/Users/kulka/OneDrive/Desktop/cert-based authentication/www";
            index index.html;
        }

        location /mtls-debug {
            default_type text/plain;
            return 200 "ssl_client_verify=$ssl_client_verify\nssl_client_s_dn=$ssl_client_s_dn\nssl_client_i_dn=$ssl_client_i_dn\n";
        }

        location /app {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
            proxy_set_header X-SSL-Client-Issuer-DN $ssl_client_i_dn;
        }
    }
}
