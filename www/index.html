<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutual TLS Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: radial-gradient(circle at top right, #eef2ff 0%, #f8fafc 100%);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border-color: #e2e8f0;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    main {
      width: min(520px, 100%);
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ecfdf5;
      color: var(--success);
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    code {
      font-family: monospace;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 14px;
      color: #334155;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      padding: 0 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #ffffff;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background: #f8fafc;
      color: var(--text-primary);
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-app: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 100%);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --border-color: #334155;
      }
      main {
        background: #1e293b;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }
      code {
        background: #334155;
        color: #e2e8f0;
      }
      .btn-secondary {
        background: #1e293b;
        color: #cbd5e1;
      }
      .btn-secondary:hover {
        background: #334155;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 32px; height: 32px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
      </svg>
    </div>
    <h1>Mutual TLS Verification Successful</h1>
    <p>Your browser presented a valid client certificate trusted by the project Root/Intermediate CA. mTLS cryptographic handshake complete.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/app">Go to PKI Portal</a>
      <a class="btn btn-secondary" href="/mtls-debug">View mTLS Verification Headers</a>
    </div>
    <div class="footer">
      Powered by Nginx & OpenSSL CA Chain
    </div>
  </main>
</body>
</html>
